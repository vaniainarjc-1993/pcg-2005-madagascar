name: Construire l'application Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Préparer la clé de signature
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Construire l'APK et le paquet Google Play (AAB)
        working-directory: android
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Renommer les fichiers
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PCG-2005-Madagascar.apk
          cp android/app/build/outputs/bundle/release/app-release.aab PCG-2005-Madagascar.aab

      - name: Mettre l'APK à disposition (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PCG-2005-Madagascar-apk
          path: PCG-2005-Madagascar.apk

      - name: Mettre le paquet Google Play à disposition
        uses: actions/upload-artifact@v4
        with:
          name: PCG-2005-Madagascar-aab-google-play
          path: PCG-2005-Madagascar.aab

      - name: Publier l'APK dans une Release (si tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PCG-2005-Madagascar.apk
            PCG-2005-Madagascar.aab
